name: Daily ES/NQ levels
on:
  schedule:
    # Mon-Fri after the session ends at 17:00 New York (21:00 UTC summer / 22:00 UTC winter).
    # Several tries in case data is late; a run with nothing new does nothing.
    - cron: "10 21 * * 1-5"
    - cron: "40 21 * * 1-5"
    - cron: "10 22 * * 1-5"
    - cron: "40 22 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  levels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install databento pandas numpy
      - run: python levels_feed.py
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
      - name: Commit new levels
        run: |
          git config user.name "levels-bot"
          git config user.email "levels-bot@users.noreply.github.com"
          git add levels.csv
          git diff --cached --quiet || (git commit -m "levels $(date -u +%F)" && git push)
